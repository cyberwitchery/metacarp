name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs need the reference Carp compiler (setup-carp clones, builds, and
# caches stock Carp, and rewrites git@ dependency URLs to https for the
# runner, and exports CARP_DIR, which the scripts and test fixtures use to
# find the standard library and reference test suite) and the carp-reader
# sibling checkout that carp-surface loads by relative path.

jobs:
  suites:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - uses: actions/checkout@v6
        with:
          repository: carpentry-org/carp-reader
          ref: e53ff2d954220c6e31fa907d4de4f3617d609fff
          path: carp-reader

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned just before the box-as-core-type refactor
          # (carp-lang/Carp#1571) this compiler does not follow yet.
          carp-ref: 0d354aa6ecaf8054396f66cd6e934c9388926f23

      - name: Run phase suites
        run: |
          set -euo pipefail
          cd carp-compiler
          for d in carp-graph carp-c-abi carp-primitives carp-surface \
                   carp-ct-env carp-ct-eval carp-ir carp-resolve carp-types \
                   carp-infer carp-specialize carp-backend carp-expand; do
            (cd "$d" && for t in test/*.carp; do
              echo "== $d/$t"
              carp -x "$t"
            done)
          done
          carp -x test/carp-compiler.carp

      - name: Install angler
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/angler /tmp/angler
          (cd /tmp/angler && carp -b main.carp)
          sudo install -m 755 /tmp/angler/out/angler /usr/local/bin/

      - name: Install carp-fmt
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/carp-fmt /tmp/carp-fmt
          (cd /tmp/carp-fmt && carp -b main.carp)
          sudo install -m 755 /tmp/carp-fmt/out/carp-fmt /usr/local/bin/

      - name: Lint
        run: |
          set -euo pipefail
          cd carp-compiler
          angler $(find . -name '*.carp' -not -path '*/out/*')

      - name: Format check
        run: |
          set -euo pipefail
          cd carp-compiler
          carp-fmt --check $(find . -name '*.carp' -not -path '*/out/*')

  self-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - uses: actions/checkout@v6
        with:
          repository: carpentry-org/carp-reader
          ref: e53ff2d954220c6e31fa907d4de4f3617d609fff
          path: carp-reader

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned just before the box-as-core-type refactor
          # (carp-lang/Carp#1571) this compiler does not follow yet.
          carp-ref: 0d354aa6ecaf8054396f66cd6e934c9388926f23

      - name: Build gen 1
        run: |
          set -euo pipefail
          cd carp-compiler
          carp -b --optimize main.carp

      - name: Reference test suite (gen 1)
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-carp-suite-self.sh

      - name: Self-host fixed point
        run: |
          set -euo pipefail
          cd carp-compiler
          core="$CARP_DIR/core"
          ./out/carp-compiler -c "$core" -o /tmp/self.c main.carp
          clang -O2 -Wl,-stack_size,0x20000000 -o /tmp/self-cc /tmp/self.c -I "$core"
          /tmp/self-cc -c "$core" -o /tmp/self2.c main.carp
          cmp /tmp/self.c /tmp/self2.c

      - name: Expansion diff vs reference
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/diff-expansion.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job needs stock Carp (setup-carp clones, builds, and caches it,
# rewrites git@ dependency URLs to https for the runner, and exports CARP_DIR,
# which the scripts and test fixtures use to find the standard library and
# reference test suite). Library dependencies, carp-reader included, install
# themselves as git references.
#
# Nothing is built through the reference compiler, though: each job builds
# generation 1 from a seed, the generation 1 of the latest main build on the
# same platform (restored from the cache below), and everything else with
# that. Only the expansion diff, which compares against the reference, runs
# it; and a job with no seed, or one too old for the current source, falls
# back to building generation 1 through it once.

jobs:
  suites:
    # The phase tests exercise compiler logic through generation 2; the
    # self-host jobs below execute generated programs on both x86-64 Linux and
    # ARM64 macOS for every commit. Running this architecture-neutral suite
    # once avoids spending another full macOS job on duplicate coverage.
    #
    # The phase step has run 27 and 36 minutes on identical code, against
    # about 20 on main, so the runner pool swings by a third on its own and
    # the two causes cannot be told apart from CI timings. 30 left roughly a
    # minute of headroom on the faster of those runs, which is a flake.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at upstream master. `type` (#53) and `meta`
          # (#54) were what held the pin at the box commit; both are
          # implemented, so the suite these commits added passes.
          carp-ref: 1d36c69d83274dbe792b9a75ed8c766f75c33264

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore seed compiler
        uses: actions/cache/restore@v5
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: carp-seed-${{ runner.os }}-${{ runner.arch }}-

      - name: Build generation 1
        env:
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh bootstrap

      - name: Cache style tools
        id: style-tools-cache
        uses: actions/cache@v5
        with:
          path: carp-compiler/.ci-tools/bin
          key: style-tools-${{ runner.os }}-${{ runner.arch }}-carp-1d36c69d83274dbe792b9a75ed8c766f75c33264-e8525dbaad2260fb1b8f4e28998fe564b87e1942-af7f3113ba11d36835aa57d9ba6a81d6671d4703

      - name: Install angler and carp-fmt
        if: steps.style-tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin"

          git init /tmp/angler
          git -C /tmp/angler remote add origin https://github.com/carpentry-org/angler
          git -C /tmp/angler fetch --depth 1 origin e8525dbaad2260fb1b8f4e28998fe564b87e1942
          git -C /tmp/angler checkout --detach FETCH_HEAD
          (cd /tmp/angler && mkdir -p out && "$GITHUB_WORKSPACE/carp-compiler/out/carp-compiler" \
            -c "$CARP_DIR/core" --optimize -b -o out/angler main.carp)
          install -m 755 /tmp/angler/out/angler \
            "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin/"

          git init /tmp/carp-fmt
          git -C /tmp/carp-fmt remote add origin https://github.com/carpentry-org/carp-fmt
          git -C /tmp/carp-fmt fetch --depth 1 origin af7f3113ba11d36835aa57d9ba6a81d6671d4703
          git -C /tmp/carp-fmt checkout --detach FETCH_HEAD
          (cd /tmp/carp-fmt && mkdir -p out && "$GITHUB_WORKSPACE/carp-compiler/out/carp-compiler" \
            -c "$CARP_DIR/core" --optimize -b -o out/carp-fmt main.carp)
          install -m 755 /tmp/carp-fmt/out/carp-fmt \
            "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin/"

      - name: Add style tools to PATH
        run: echo "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin" >> "$GITHUB_PATH"

      - name: Phase assurance
        env:
          CARP_SKIP_STYLE: '0'
          CARP_PHASE_JOBS: '2'
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh phase

  sanitize:
    # Ownership bugs in the code we emit (a delete before a last use, a capture
    # freed twice) are invisible to every compile-time gate and to the
    # programs' own assertions. Running the corpus under AddressSanitizer is
    # the only thing that catches them. Linux only: one architecture is enough
    # for a memory-safety check, and it keeps the macOS runner budget free.
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at upstream master. `type` (#53) and `meta`
          # (#54) were what held the pin at the box commit; both are
          # implemented, so the suite these commits added passes.
          carp-ref: 1d36c69d83274dbe792b9a75ed8c766f75c33264

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore seed compiler
        uses: actions/cache/restore@v5
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: carp-seed-${{ runner.os }}-${{ runner.arch }}-

      - name: Sanitizer assurance
        env:
          CARP_SELF_JOBS: '2'
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh sanitize

  llvm:
    # The LLVM backend renders the same lowered module as the C backend but
    # places some frees on its own, so the two can drift apart (#79). Each
    # memory fixture runs under both drivers and has to balance and agree.
    # Linux only, like the sanitizer job: libLLVM comes from the distribution.
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at upstream master. `type` (#53) and `meta`
          # (#54) were what held the pin at the box commit; both are
          # implemented, so the suite these commits added passes.
          carp-ref: 1d36c69d83274dbe792b9a75ed8c766f75c33264

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore seed compiler
        uses: actions/cache/restore@v5
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: carp-seed-${{ runner.os }}-${{ runner.arch }}-

      - name: Install LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-dev
          llvm-config --version

      - name: LLVM assurance
        env:
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh llvm

  self-host:
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at upstream master. `type` (#53) and `meta`
          # (#54) were what held the pin at the box commit; both are
          # implemented, so the suite these commits added passes.
          carp-ref: 1d36c69d83274dbe792b9a75ed8c766f75c33264

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Restore seed compiler
        uses: actions/cache/restore@v5
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: carp-seed-${{ runner.os }}-${{ runner.arch }}-

      - name: Self-host assurance
        env:
          CARP_SELF_JOBS: ${{ runner.os == 'macOS' && '3' || '2' }}
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh self

      # a main build that passed leaves its generation 1 as the next seed for
      # this platform; pull requests read it and never write one
      - name: Keep generation 1 as the seed
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p carp-compiler/.ci-seed
          cp carp-compiler/out/carp-compiler carp-compiler/.ci-seed/carp-compiler

      - name: Save seed compiler
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

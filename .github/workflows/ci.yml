name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job needs the reference Carp compiler (setup-carp clones, builds, and
# caches stock Carp, and rewrites git@ dependency URLs to https for the
# runner, and exports CARP_DIR, which the scripts and test fixtures use to
# find the standard library and reference test suite). Library dependencies,
# carp-reader included, install themselves as git references.

jobs:
  suites:
    # The phase tests exercise compiler logic through the reference compiler;
    # the self-host jobs below execute generated programs on both x86-64 Linux
    # and ARM64 macOS for every commit. Running this architecture-neutral suite
    # once avoids spending another full macOS job on duplicate coverage.
    #
    # The phase step has run 27 and 36 minutes on identical code, against
    # about 20 on main, so the runner pool swings by a third on its own and
    # the two causes cannot be told apart from CI timings. 30 left roughly a
    # minute of headroom on the faster of those runs, which is a flake.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at the commit this compiler follows: core's
          # `Box` is an ordinary recursive type here (carp-lang/Carp#1571).
          # The next upstream commit (#1572) tests `(type {@"test" 1})` and
          # #1581 tests `(meta f "docexample")`, two primitives this compiler
          # does not implement yet (#53, #54); the pin moves on with them.
          carp-ref: 6452fa5568a201bea0277e2fd6c1c3859182b801

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Cache style tools
        id: style-tools-cache
        uses: actions/cache@v5
        with:
          path: carp-compiler/.ci-tools/bin
          key: style-tools-${{ runner.os }}-${{ runner.arch }}-carp-6452fa5568a201bea0277e2fd6c1c3859182b801-fd6d6826d830263d9f66c7b55cfc7e33b90eb337-13d3c0246dbc6b9b4004ebc222afab85f4235af7

      - name: Install angler and carp-fmt
        if: steps.style-tools-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin"

          git init /tmp/angler
          git -C /tmp/angler remote add origin https://github.com/carpentry-org/angler
          git -C /tmp/angler fetch --depth 1 origin fd6d6826d830263d9f66c7b55cfc7e33b90eb337
          git -C /tmp/angler checkout --detach FETCH_HEAD
          (cd /tmp/angler && carp -b main.carp)
          install -m 755 /tmp/angler/out/angler \
            "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin/"

          git init /tmp/carp-fmt
          git -C /tmp/carp-fmt remote add origin https://github.com/carpentry-org/carp-fmt
          git -C /tmp/carp-fmt fetch --depth 1 origin 13d3c0246dbc6b9b4004ebc222afab85f4235af7
          git -C /tmp/carp-fmt checkout --detach FETCH_HEAD
          (cd /tmp/carp-fmt && carp -b main.carp)
          install -m 755 /tmp/carp-fmt/out/carp-fmt \
            "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin/"

      - name: Add style tools to PATH
        run: echo "$GITHUB_WORKSPACE/carp-compiler/.ci-tools/bin" >> "$GITHUB_PATH"

      - name: Phase assurance
        env:
          CARP_SKIP_STYLE: '0'
          CARP_PHASE_JOBS: '2'
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh phase

  sanitize:
    # Ownership bugs in the code we emit (a delete before a last use, a capture
    # freed twice) are invisible to every compile-time gate and to the
    # programs' own assertions. Running the corpus under AddressSanitizer is
    # the only thing that catches them. Linux only: one architecture is enough
    # for a memory-safety check, and it keeps the macOS runner budget free.
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at the commit this compiler follows: core's
          # `Box` is an ordinary recursive type here (carp-lang/Carp#1571).
          # The next upstream commit (#1572) tests `(type {@"test" 1})` and
          # #1581 tests `(meta f "docexample")`, two primitives this compiler
          # does not implement yet (#53, #54); the pin moves on with them.
          carp-ref: 6452fa5568a201bea0277e2fd6c1c3859182b801

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Sanitizer assurance
        env:
          CARP_SELF_JOBS: '2'
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh sanitize

  self-host:
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1
        with:
          # stock carp, pinned at the commit this compiler follows: core's
          # `Box` is an ordinary recursive type here (carp-lang/Carp#1571).
          # The next upstream commit (#1572) tests `(type {@"test" 1})` and
          # #1581 tests `(meta f "docexample")`, two primitives this compiler
          # does not implement yet (#53, #54); the pin moves on with them.
          carp-ref: 6452fa5568a201bea0277e2fd6c1c3859182b801

      - name: Cache Carp libraries
        uses: actions/cache@v5
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Self-host assurance
        env:
          CARP_SELF_JOBS: ${{ runner.os == 'macOS' && '3' || '2' }}
        run: |
          set -euo pipefail
          cd carp-compiler
          ./scripts/run-assurance.sh self

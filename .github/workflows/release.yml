name: release

# A version tag builds the self-hosted compiler on each platform the self-host
# job covers and attaches the archives to a GitHub release. Each archive holds
# the generation-2 binary (built only after the fixed-point check passes), the
# Carp core it was built against, and a provenance file. A manual run builds
# the archives without publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the platforms ci.yml seeds; one without a seed builds generation 1
        # through the reference, which costs several times the whole build.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: carp-compiler

      - name: Setup Carp
        uses: carpentry-org/setup-carp@4e0899a08e14999a11349790d0a7a86895b789e5 # v1
        with:
          # keep in step with ci.yml: the release ships this core.
          carp-ref: 1d36c69d83274dbe792b9a75ed8c766f75c33264

      - name: Cache Carp libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/carp/libs
          key: carp-libs-${{ runner.os }}-${{ runner.arch }}-v1

      # main's latest generation 1 for this platform, as in ci.yml; the
      # fixed-point check below decides whether what it builds is shipped.
      - name: Restore seed compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: carp-compiler/.ci-seed
          key: carp-seed-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: carp-seed-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release archive
        env:
          CARP_SEED_COMPILER: ${{ github.workspace }}/carp-compiler/.ci-seed/carp-compiler
          CARP_RELEASE_OUT: ${{ runner.temp }}/dist
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd carp-compiler
          version=
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=${REF_NAME#v}
          fi
          ./scripts/build-release.sh "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz >SHA256SUMS
          gh release create "$REF_NAME" -R "$REPO" --verify-tag \
            --title "$REF_NAME" --generate-notes ./*.tar.gz SHA256SUMS
